version: 2
# Weekly dependency PRs. Grouped to avoid PR churn from minor/patch
# updates in lockstep packages (Vite + plugins, Playwright, etc.).
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      vite:
        patterns:
          - 'vite'
          - '@vitejs/*'
          - 'vitest'
      playwright:
        patterns:
          - '@playwright/*'
          - 'playwright'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react*'
      eslint:
        patterns:
          - 'eslint'
          - '@eslint/*'
          - 'eslint-*'
          - '@typescript-eslint/*'
      typescript:
        patterns:
          - 'typescript'
          - 'tsx'
          - 'tslib'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
